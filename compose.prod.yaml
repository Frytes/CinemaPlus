services:
  # === REVERSE PROXY ===
  nginx:
    image: nginx:alpine
    container_name: cinema_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cinema-net

  # === FRONTEND ===
  frontend:
    build: ./frontend
    container_name: cinema_frontend
    restart: always
    networks:
      - cinema-net

  # === BACKEND ===
  backend:
    build: .
    container_name: cinema_backend
    restart: always
    environment:
      - TZ=Europe/Moscow
      - SPRING_PROFILES_ACTIVE=light
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/CinemaPlus
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_DATA_REDIS_HOST=redis
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

      - LOKI_URL=http://localhost
      - CINEMA_INFRASTRUCTURE_LOKI_URL=http://localhost
      - CINEMA_INFRASTRUCTURE_PROMETHEUS_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cinema-net

  # === DATABASE ===
  postgres:
    image: postgres:15-alpine
    container_name: cinema_postgres
    restart: always
    environment:
        TZ: Europe/Moscow
        POSTGRES_DB: "CinemaPlus"
        POSTGRES_USER: "myuser"
        POSTGRES_PASSWORD: "secret"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d CinemaPlus"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cinema-net


  redis:
    image: redis:alpine
    container_name: cinema_redis
    restart: always
    networks:
      - cinema-net

networks:
  cinema-net:
    driver: bridge

volumes:
  postgres_data: