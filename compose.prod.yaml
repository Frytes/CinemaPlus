version: '3.8'

services:
  # === REVERSE PROXY ===
  nginx:
    image: nginx:alpine
    container_name: cinema_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cinema-net

  # === FRONTEND ===
  frontend:
    build: ./frontend
    container_name: cinema_frontend
    restart: always
    networks:
      - cinema-net

  # === BACKEND ===
  backend:
    build: .
    container_name: cinema_backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=light
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}

      - LOKI_URL=http://localhost
      - CINEMA_INFRASTRUCTURE_LOKI_URL=http://localhost
      - CINEMA_INFRASTRUCTURE_PROMETHEUS_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cinema-net

  # === DATABASE ===
  postgres:
    image: postgres:15-alpine
    container_name: cinema_postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-net


  redis:
    image: redis:alpine
    container_name: cinema_redis
    restart: always
    networks:
      - cinema-net

networks:
  cinema-net:
    driver: bridge

volumes:
  postgres_data: