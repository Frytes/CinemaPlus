services:
  # === APPLICATION ===
  backend:
    build: .
    container_name: cinema_backend
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Moscow
      - SPRING_PROFILES_ACTIVE=${APP_PROFILE:-light}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/CinemaPlus
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_MAIL_HOST=mailhog
      - CINEMA_INFRASTRUCTURE_LOKI_URL=http://loki:3100/ready
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - CINEMA_INFRASTRUCTURE_PROMETHEUS_URL=http://prometheus:9090/-/healthy
    depends_on:
       postgres:
         condition: service_healthy
       redis:
         condition: service_started
       loki:
         condition: service_started
       prometheus:
         condition: service_started



    networks:
      - default
  frontend:
    build: ./frontend
    container_name: cinema_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # === DATABASE ===
  postgres:
    image: 'postgres:15-alpine'
    container_name: cinema_postgres
    environment:
      - 'POSTGRES_DB=CinemaPlus'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d CinemaPlus" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:alpine'
    container_name: cinema_redis
    ports:
      - '6379:6379'
    command: redis-server --protected-mode no
    labels:
      org.springframework.boot.ignore: true

  kafka:
    image: apache/kafka:3.7.0
    container_name: cinema_kafka
    profiles: [ "full" ]
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 60
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 30s
      timeout: 10s
      retries: 3


  kafka-ui:
    profiles: ["full"]
    image: provectuslabs/kafka-ui:latest
    container_name: cinema_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # === MONITORING STACK ===
  prometheus:
    image: prom/prometheus:latest
    container_name: cinema_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    container_name: cinema_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: cinema_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["full"]
    container_name: cinema_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: "none"



volumes:
  grafana_data:
  postgres_data:
