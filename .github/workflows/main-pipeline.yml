name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

jobs:
  tests:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: |
          chmod +x mvnw
          ./mvnw clean package

  deploy:
    name: Deploy to Prod
    runs-on: self-hosted
    needs: tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          TARGET_DIR=~/CinemaPlus
          mkdir -p $TARGET_DIR

          cp Dockerfile $TARGET_DIR/
          cp pom.xml $TARGET_DIR/
          
          rm -rf $TARGET_DIR/src
          cp -r src $TARGET_DIR/
          
          cp compose.prod.yaml $TARGET_DIR/
          cp nginx.conf $TARGET_DIR/
          
          rm -rf $TARGET_DIR/frontend
          cp -r frontend $TARGET_DIR/
          
          cd $TARGET_DIR
          
          cat <<EOF > .env
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          APP_PROFILE=light
          EOF
          
          docker compose -f compose.prod.yaml down
          docker compose -f compose.prod.yaml up -d --build --remove-orphans
          docker image prune -f