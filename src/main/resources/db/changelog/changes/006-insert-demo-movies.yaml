databaseChangeLog:
  - changeSet:
      id: 006-insert-demo-movies
      author: frytes
      changes:
        - sql:
            sql: |
              INSERT INTO movies (title, description, duration_minutes, poster_url, release_year, rating, age_limit, genre) VALUES
              ('Начало', 'Кобб — талантливый вор, лучший из лучших в опасном искусстве извлечения: он крадет ценные секреты из глубин подсознания во время сна, когда человеческий разум наиболее уязвим.', 148, 'https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg', 2010, 8.8, 12, 'Фантастика, Боевик'),
              
              ('Интерстеллар', 'Наше время на Земле подошло к концу, команда исследователей берет на себя самую важную миссию в истории человечества; путешествуя за пределы нашей галактики, чтобы узнать, есть ли у человечества будущее среди звезд.', 169, 'https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg', 2014, 8.6, 12, 'Фантастика, Приключения'),
              
              ('Темный рыцарь', 'Бэтмен поднимает ставки в войне с криминалом. С помощью лейтенанта Джима Гордона и прокурора Харви Дента он намерен очистить улицы от преступности, отравляющей город.', 152, 'https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg', 2008, 9.0, 16, 'Боевик, Криминал'),
              
              ('Джокер', 'Готэм, начало 1980-х годов. Комик Артур Флек живет с больной матерью, которая с детства учит его «ходить с улыбкой». Пытаясь нести в мир хорошее и дарить людям радость, Артур сталкивается с человеческой жестокостью.', 122, 'https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg', 2019, 8.4, 18, 'Криминал, Драма'),
              
              ('Человек-паук: Паутина вселенных', 'Майлз Моралес отправляется в приключение по мультивселенной вместе с Гвен Стейси и новой командой Людей-Пауков, которым предстоит сразиться с могущественным злодеем.', 140, 'https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg', 2023, 8.7, 6, 'Мультфильм, Боевик'),
              
              ('Кунг-фу Панда 4', 'По, Воин Дракона, призван судьбой... чтобы уже наконец отдохнуть. Точнее, он призван стать Духовным Лидером Долины Мира. Но сначала ему нужно найти и обучить нового Воина Дракона.', 94, 'https://image.tmdb.org/t/p/w500/kDp1vUBnMpe8ak4rjgl3cLELqjU.jpg', 2024, 7.1, 0, 'Мультфильм, Комедия'),
              
              ('Гадкий я 4', 'Грю, Люси и их девочки — Марго, Эдит и Агнес — приветствуют нового члена семьи, Грю-младшего, который намерен мучить своего отца. Грю сталкивается с новым врагом.', 95, 'https://cdn.premierzal.ru/files/image/fjldvc1wswai-zln.jpg', 2024, 7.3, 0, 'Мультфильм, Семейный'),
              
              ('Головоломка 2', 'Головоломка 2 возвращается в сознание новоиспеченного подростка Райли как раз в тот момент, когда штаб-квартира подвергается внезапному сносу, чтобы освободить место для чего-то совершенно неожиданного: новых Эмоций!', 96, 'https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg', 2024, 7.7, 6, 'Мультфильм, Семейный');