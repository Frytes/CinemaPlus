spring:
  application:
    name: CinemaPlus

  docker:
    compose:
      lifecycle-management: start_only
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/CinemaPlus
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${MY_WSL_IP:localhost}
      port: 6379
      timeout: 2000ms


  kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      consumer:
        group-id: notification-group
        auto-offset-reset: latest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        admin:
        properties:
          request.timeout.ms: 5000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    protocol: smtp
    test-connection: true
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    root: INFO
#    org.springframework.security: DEBUG
    org.apache.kafka: WARN
    org.apache.zookeeper: WARN
    org.hibernate.SQL: INFO
    com.frytes.cinemaPlus: INFO

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

#Настройки
cinema:
  default-ads-minutes: 15       # Дефолтные значения рекламы
  default-cleanup-minutes: 20   # Дефолтные значения уборки
  pricing:
    base-price-morning: 250     # Базовая цена утром
    base-price-evening: 450     # Базовая цена вечером
    surcharge_red_hall: 100     # Надбавка за красный зал
    surcharge_blue_hall: 100    # Надбавка за синий зал
    surcharge_green_hall: 0     # Надбавка за зеленый зал
    vip-surcharge: 200          # Добавочная цена за VIP место
  lock-duration: 10             # Время блокировки заказа
  payment:
    delay-ms: 1000              # Длительность задержки банка при оплате заказа
    fail-probability: 10        # Вероятность отказа в % (0-100)
